services:
  - type: web
    name: codelens-ai
    runtime: docker
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: ANONYMIZED_TELEMETRY
        value: "false"
      - key: CHROMA_DATA_DIR
        value: /opt/render/project/src/chroma_data
    disk:
      name: chroma-data
      mountPath: /opt/render/project/src/chroma_data
      sizeGB: 1
