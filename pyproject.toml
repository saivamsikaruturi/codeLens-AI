[project]
name = "codelens-ai"
version = "1.0.0"
description = "Intelligent Codebase Q&A powered by RAG with AST-aware chunking"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "anthropic==0.40.0",
    "chromadb==0.5.23",
    "pydantic==2.10.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
